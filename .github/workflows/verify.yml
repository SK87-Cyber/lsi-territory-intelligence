name: Verify lighting intelligence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lighting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-infra.txt
      - run: npm run build
      - name: Unit and transaction integration tests
        env:
          # Local ephemeral service; production DATABASE_URL is never used by tests.
          LSI_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/lighting_test
          LSI_TEST_DATABASE: '1'
          PGSSLMODE: disable
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: verified-lighting-site
          path: dist/
          retention-days: 30
